name: Update RSS Feed
# This workflow listens for repository_dispatch events of type 'publish_post' and updates the fso.feed.xml file with the new post information.

on:
  repository_dispatch:
    types: [publish_post]

jobs:
  update-feed:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create or update RSS feed
      run: |
        export FEED_FILE="fso.feed.xml"

        python3 <<'PY'
        import json
        import os
        import sys
        from email.utils import format_datetime, parsedate_to_datetime
        from html import escape
        from pathlib import Path
        from xml.etree import ElementTree as ET

        feed_file = Path(os.environ["FEED_FILE"])
        event_path = Path(os.environ["GITHUB_EVENT_PATH"])

        with event_path.open("r", encoding="utf-8") as event_file:
            event = json.load(event_file)

        payload = event.get("client_payload", {})
        required_fields = ["title", "url", "content", "date"]
        missing = [field for field in required_fields if not payload.get(field)]
        if missing:
            sys.exit(f"Missing required payload fields: {', '.join(missing)}")

        categories = payload.get("categories", payload.get("category"))
        if not categories:
            sys.exit("Missing required payload field: category or categories")
        if isinstance(categories, list):
            categories = ", ".join(str(item) for item in categories)
        elif not isinstance(categories, str):
            categories = str(categories)

        author = payload.get("author")

        url = payload["url"]
        if not url.startswith(("http://", "https://")):
            sys.exit("The url payload must be a full URL starting with http:// or https://")

        from datetime import datetime


        def parse_date(value: str):
            try:
                return parsedate_to_datetime(value)
            except (TypeError, ValueError):
                pass
            try:
                return datetime.fromisoformat(value)
            except ValueError:
                raise

        try:
            pub_date_dt = parse_date(payload["date"])
        except (TypeError, ValueError):
            sys.exit("Invalid pubDate format: must be a valid RFC 822 / RFC 2822 date or ISO 8601 timestamp")

        pub_date = format_datetime(pub_date_dt)


        def sanitize_cdata(text: str) -> str:
            return text.replace("]]>", "]]]]]><![CDATA[>")


        def render_item(item: dict) -> str:
            author_line = f"    <author>{escape(item['author'])}</author>\n" if item.get('author') else ""
            parts = []
            parts.append("  <item>")
            parts.append(f"    <title>{escape(item['title'])}</title>")
            parts.append(f"    <link>{escape(item['link'])}</link>")
            if author_line:
                parts.append(author_line.rstrip())
            parts.append("    <description><![CDATA[")
            parts.append(sanitize_cdata(item['content']))
            parts.append("    ]]></description>")
            parts.append(f"    <pubDate>{escape(item['pubDate'])}</pubDate>")
            parts.append(f"    <category>{escape(item['category'])}</category>")
            parts.append("  </item>")
            return "\n".join(parts) + "\n"

        new_item = {
            "title": payload["title"],
            "link": url,
            "content": payload["content"],
            "pubDate": pub_date,
            "category": categories,
        }
        if author:
            new_item["author"] = author

        items = []
        channel_metadata = {
            "title": "Faculty Senate News Feed",
            "link": "https://facultysenate.umich.edu",
            "description": "Faculty Senate website news feed",
        }

        if feed_file.exists():
            try:
                tree = ET.parse(feed_file)
                root = tree.getroot()
                channel = root.find("channel")
                if channel is None:
                    sys.exit("Existing feed is invalid: missing channel element")

                for child in channel:
                    if child.tag == "item":
                        items.append({
                            "title": child.findtext("title", default=""),
                            "link": child.findtext("link", default=""),
                            "author": child.findtext("author", default=""),
                            "content": child.findtext("description", default=""),
                            "pubDate": child.findtext("pubDate", default=""),
                            "category": child.findtext("category", default=""),
                        })
                    elif child.tag in channel_metadata:
                        channel_metadata[child.tag] = child.text or channel_metadata[child.tag]
            except ET.ParseError:
                # File exists but is invalid/empty - treat as new feed
                items = []

        items.append(new_item)


        def item_date(item: dict):
            text = item.get("pubDate", "")
            try:
                return parsedate_to_datetime(text)
            except (TypeError, ValueError):
                try:
                    return datetime.fromisoformat(text)
                except ValueError:
                    return pub_date_dt

        sorted_items = sorted(items, key=item_date, reverse=True)

        feed_text = [
            '<?xml version="1.0" encoding="UTF-8" ?>',
            '<rss version="2.0">',
            '  <channel>',
            f'    <title>{escape(channel_metadata["title"])}</title>',
            f'    <link>{escape(channel_metadata["link"])}</link>',
            f'    <description>{escape(channel_metadata["description"])}</description>',
        ]

        for item in sorted_items:
            feed_text.append(render_item(item))

        feed_text.extend([
            '  </channel>',
            '</rss>',
        ])

        feed_file.write_text("\n".join(feed_text) + "\n", encoding="utf-8")
        PY

    - name: Commit Updated RSS Feed
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git add fso.feed.xml

        git diff --cached --quiet || git commit -m "Update RSS feed"

        git push